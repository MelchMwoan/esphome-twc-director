# tesla-director.yaml

substitutions:
  global_max_current: "48"      # The circuit maximum for all twc
  global_twc_max_current: "32"  # The circuit maximum per twc
  master_addr: "0xF00D"         # The 2 byte address of the TWC director
  twc_0_name: "Slot 0"          # twc 1 Friendly Name
  twc_0_addr: "0x1234"          # twc 1 address for consistent mapping
  twc_0_initial_current: "15"   # twc 1 Initial Current
  twc_0_max_current: "32"       # twc 1 Max Current (upper bound)

esphome:
  name: tesla-director
  friendly_name: Tesla-Director
  project:
    name: "Wired Square.Tesla Wall Connector Director"
    version: "v0.0.1"
  on_boot:
    priority: 200
    then:
      - output.turn_on: tcan485_boost_en        # GPIO16, 5V boost power
      - output.turn_on: tcan485_rs485_shutdown  # GPIO19, shutdown disable (HIGH = enable)
      - output.turn_on: tcan485_rs485_re        # GPIO17, receiver enable
      - delay: 100ms                            # Let RS-485 transceiver stabilize
      - switch.turn_on: twc_master_mode
      - number.set:
          id: twc_0_max_current_num
          value: ${twc_0_max_current}
      - number.set:
          id: twc_0_initial_current_num
          value: ${twc_0_initial_current}
  on_shutdown:
    then:
      - output.turn_off: tcan485_boost_en       # Disable GPIO16 before reset to avoid boot hang
      # Blocking settle. App.reboot() calls on_shutdown then arch_restart() immediately, with
      # no teardown, so without this the 5V rail is still up when the ESP32 resets. An
      # automation `delay:` is scheduler-based and would not block here.
      - lambda: 'delay(250);'

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/Wired-Square/esphome-twc-director.git

logger:
  # DEBUG, not VERBOSE: VERBOSE compiles in the per-received-byte RX log, which the runtime
  # log-level select can turn on at any time. At 9600 baud that is ~960 formatted lines/sec
  # pushed over the API socket.
  level: DEBUG
  initial_level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret tesla_director_api_key
  # Never reboot just because Home Assistant is away (upgrades, restarts). The default 15min
  # takes a live charge controller down via App.reboot(), which is the unsafe reset path.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret tesla_director_ota_password

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Tesla-Director Fallback Hotspot"
    password: !secret wifi_hotspot_password

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

captive_portal:

# WiFi recovery watchdog. The fallback `ap:` above disables ESPHome's built-in
# wifi.reboot_timeout (gated on !has_ap()), so a wedged WiFi stack would never recover on its
# own. Reboot through App.safe_reboot() so the on_shutdown settle above actually runs.
script:
  - id: wifi_recovery_reboot
    mode: single
    then:
      - delay: 10min
      - logger.log:
          level: ERROR
          format: "WiFi down for 10 min - safe rebooting"
      - lambda: 'App.safe_reboot();'

interval:
  - interval: 30s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.stop: wifi_recovery_reboot
          else:
            - script.execute: wifi_recovery_reboot

# UART on the RS-485 transceiver
uart:
  id: twc_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

output:
  # Boost power supply enable (BOOST_ENABLE_PIN 16)
  - platform: gpio
    id: tcan485_boost_en
    pin: GPIO16

  # MAX13487E shutdown pin (RS485_SHUTDOWN_PIN 19) - HIGH = enable
  - platform: gpio
    id: tcan485_rs485_shutdown
    pin: GPIO19

  # MAX13487E RE pin (RS485_RE_PIN 17) — HIGH = receive enable
  - platform: gpio
    id: tcan485_rs485_re
    pin: GPIO17

select:
  - platform: logger
    name: Tesla Director log level
    disabled_by_default: true

# Diagnostics. On the boot following an incident, Reset Reason separates a bootloader hang
# (Power On Reset - it needed a power cycle) from a crash loop (Brownout / Task Watchdog).
debug:
  update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    bssid:
      name: "BSSID"

twc_director:
  id: twc_component
  uart_id: twc_uart
  addr: ${master_addr}
  global_max_current: ${global_max_current}
  global_twc_max_current: ${global_twc_max_current}
  master_mode:
    id: twc_master_mode
  charging_count:
  link_ok:
    name: RS-485 Link
  evse:
    - name: ${twc_0_name}
      #address: ${twc_0_addr}
      twc_online:
      firmware_version:
      meter_current_phase_a:
        name: ${twc_0_name} Current
      meter_current_phase_b:
        disabled_by_default: true
      meter_current_phase_c:
        disabled_by_default: true
      meter_energy_session:
      meter_energy_total:
      meter_voltage_phase_a:
        name: ${twc_0_name} Voltage
      meter_voltage_phase_b:
        disabled_by_default: true
      meter_voltage_phase_c:
        disabled_by_default: true
      serial_number:
      vehicle_connected:
      vehicle_vin:
      contactor:
      contactor_status:
      available_current_sensor:
      max_current:
        id: twc_0_max_current_num
      max_current_sensor:
      initial_current:
        id: twc_0_initial_current_num
      session_current:
      session_current_sensor:
      mode:
      status_text:
      status_log:

